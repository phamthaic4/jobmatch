name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff check
        run: ruff check app scripts tests

  unit:
    name: Unit tests (no weights)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Pytest
        run: python -m pytest -m "not slow" -q

  integration:
    name: API tests (weights from the Proj 1 release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Download the checkpoint
        run: |
          mkdir -p models/phobert-ner
          BASE=https://github.com/phamthaic4/vietnamese-job-skill-ner/releases/download/v1.0.0
          curl -fsSL -o models/phobert-ner/model.onnx "$BASE/model.onnx"
          curl -fsSL -o models/phobert-ner/tokenizer.zip "$BASE/tokenizer.zip"
          unzip -o models/phobert-ner/tokenizer.zip -d models/phobert-ner
      - name: Pytest
        run: python -m pytest -q
